<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">Sandeep Barhanpure — I build the thing, then the system that scales it</title>
  <desc id="description">A blueprint-inspired diagram showing Sandeep's operating pattern: spot the opportunity, prove it with a real product, and scale it through teams and platforms.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102A52" />
      <stop offset="0.58" stop-color="#153F6D" />
      <stop offset="1" stop-color="#0C625F" />
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9A7A" />
      <stop offset="0.54" stop-color="#FFD166" />
      <stop offset="1" stop-color="#55D6BE" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EAF3FF" stroke-width="1" opacity="0.075" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06172E" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#background)" />
  <rect width="1280" height="420" rx="28" fill="url(#grid)" />

  <g opacity="0.18" fill="none" stroke="#BFE9FF">
    <path d="M 1010 42 C 1090 72 1088 142 1168 167 S 1248 265 1196 338" />
    <path d="M 1074 24 C 1148 78 1136 117 1212 143" />
    <circle cx="1010" cy="42" r="5" fill="#BFE9FF" />
    <circle cx="1168" cy="167" r="5" fill="#BFE9FF" />
    <circle cx="1196" cy="338" r="5" fill="#BFE9FF" />
    <circle cx="1074" cy="24" r="5" fill="#BFE9FF" />
    <circle cx="1212" cy="143" r="5" fill="#BFE9FF" />
  </g>

  <text x="72" y="68" fill="#B8D9ED" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="3">SANDEEP BARHANPURE  /  PRODUCT · ENGINEERING · AI</text>

  <text x="68" y="151" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="750" letter-spacing="-2">I build the thing—</text>
  <text x="68" y="218" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="750" letter-spacing="-2">then the system that scales it.</text>
  <rect x="70" y="242" width="554" height="5" rx="2.5" fill="url(#signal)" />

  <g filter="url(#shadow)">
    <rect x="68" y="282" width="262" height="100" rx="14" fill="#F5F9FF" />
    <rect x="366" y="282" width="262" height="100" rx="14" fill="#F5F9FF" />
    <rect x="664" y="282" width="262" height="100" rx="14" fill="#F5F9FF" />
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="92" y="314" fill="#B84A36" font-size="12" font-weight="700" letter-spacing="2">SPOT IT</text>
    <text x="92" y="341" fill="#173C65" font-size="14" font-weight="600">
      <tspan x="92" dy="0">Find what the org</tspan>
      <tspan x="92" dy="20">is ignoring</tspan>
    </text>

    <text x="390" y="314" fill="#8A6418" font-size="12" font-weight="700" letter-spacing="2">PROVE IT</text>
    <text x="390" y="341" fill="#173C65" font-size="14" font-weight="600">
      <tspan x="390" dy="0">Ship the smallest</tspan>
      <tspan x="390" dy="20">real thing</tspan>
    </text>

    <text x="688" y="314" fill="#08776D" font-size="12" font-weight="700" letter-spacing="2">SCALE IT</text>
    <text x="688" y="341" fill="#173C65" font-size="14" font-weight="600">
      <tspan x="688" dy="0">Build the team</tspan>
      <tspan x="688" dy="20">and the paved road</tspan>
    </text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 340 332 H 353" stroke="#FFD166" stroke-width="3" />
    <path d="M 347 325 L 354 332 L 347 339" stroke="#FFD166" stroke-width="3" />
    <path d="M 638 332 H 651" stroke="#55D6BE" stroke-width="3" />
    <path d="M 645 325 L 652 332 L 645 339" stroke="#55D6BE" stroke-width="3" />
  </g>

  <g transform="translate(1000 255)">
    <circle cx="90" cy="80" r="74" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.18" />
    <circle cx="90" cy="80" r="48" fill="none" stroke="#55D6BE" stroke-width="2" opacity="0.65" />
    <circle cx="90" cy="80" r="8" fill="#FFD166" />
    <circle cx="90" cy="6" r="5" fill="#FF9A7A" />
    <circle cx="164" cy="80" r="5" fill="#55D6BE" />
    <circle cx="90" cy="154" r="5" fill="#55D6BE" />
    <circle cx="16" cy="80" r="5" fill="#FF9A7A" />
    <path d="M 90 14 V 72 M 98 80 H 156 M 90 88 V 146 M 24 80 H 82" stroke="#D7F4F0" stroke-width="2" opacity="0.5" />
  </g>
</svg>
